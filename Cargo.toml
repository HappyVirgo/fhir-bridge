[package]
name = "fhir-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HL7 v2.x parser and HL7 v2 to FHIR R4 converter with Safe Harbor-style de-identification"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false
